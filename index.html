<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みみアラート</title>
<meta name="description" content="イヤホン中でも、周りの音や呼びかけをアラートで知らせるWebアプリ">
<meta name="theme-color" content="#111418">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👂</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>👂 みみアラート</h1>
  </header>

  <section class="card status-card">
    <div class="status-row">
      <div id="status" class="status idle">停止中</div>
      <button id="toggle" class="primary">聞き取り開始</button>
    </div>
  </section>

  <section class="card">
    <h2>🗣 聞き取った言葉</h2>
    <div id="interim" class="interim"></div>
    <ul id="transcripts" class="log"></ul>
  </section>

  <section class="card">
    <h2>🔔 アラート履歴</h2>
    <ul id="events" class="log"></ul>
  </section>

  <footer>
    <p>文字起こしはブラウザの音声認識を使うため、Chromeでは音声がGoogleのサーバーに送られます。初回は音声モデル（約200MB）のダウンロードに時間がかかります。</p>
  </footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
